name: release artifacts

# What users download for a release is a clean build of the release's
# version commit: the GitHub release's b3sum programs by the build version
# they hold, the b3sums crate from crates.io file by file against the
# commit (tools/release_artifacts.py), and byte for byte what these two
# machines build and package from the tag (tools/b3sum-release.sh and
# tools/crates-release.sh, whose outputs are reproducible): a binary or
# crate with other code or lock metadata fails here whatever it says of
# itself. The tag is verified against main's history and its version-only
# delta before either builder runs any code from the tag, and every job
# pins the exact verified commit SHA. Run automatically when a release is
# published (note: GitHub runs `release: published` from the tag's own
# workflow revision; for authoritative verification independent of the tag,
# trigger `workflow_dispatch` on `main` or run `tools/release_artifacts.py`
# from a trusted `main` checkout).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag: vX.Y.Z+<the code commit>"
        required: true

permissions:
  contents: read

jobs:
  verify-tag:
    name: verify release tag ancestry and version-only delta
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
      code: ${{ steps.verify.outputs.code }}
    steps:
      # Check out main (never the tag) so tag validation runs from a trusted
      # branch before either builder executes any script from the tag.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - name: Verify tag format, main ancestry, parent, and version-only diff
        id: verify
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\+[0-9a-f]{40}$ ]]; then
            echo "not a release tag (vX.Y.Z+<40 hex>): $TAG" >&2
            exit 1
          fi
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main "refs/tags/$TAG:refs/tags/$TAG"
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          code="${TAG#*+}"
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "tag $TAG commit $commit is not in origin/main's history" >&2
            exit 1
          fi
          parent=$(git rev-parse --verify "${commit}^")
          if [[ "$parent" != "$code" ]]; then
            echo "tag $TAG commit $commit parent $parent does not match tag code commit $code" >&2
            exit 1
          fi
          # Verify version-only delta using main's checker before running
          # any build script from the tag's commit.
          python3 -c '
          import sys
          sys.path.insert(0, "tools")
          import release_artifacts as ra
          ra.Release(sys.argv[1], commit=sys.argv[2])
          ' "$TAG" "$commit"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'code=%s\n' "$code" >> "$GITHUB_OUTPUT"

  build:
    name: b3sum and crate, built again from the verified commit
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          # The verified version commit and its parent, which it names.
          fetch-depth: 2
      - name: Install Rust toolchain
        run: |
          TOOLCHAIN=$(sed -n 's/^rustc //p' tools/b3sum-release.toolchain)
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
      # Package the b3sums crate before Docker runs as root so dist/ is
      # created owned by the runner user and fast-fails before the
      # container build.
      - name: Package b3sums crate from the verified commit
        run: sh tools/crates-release.sh --no-verify
      - name: Build static Linux binary in pinned container
        run: docker run --rm -v "$PWD":/src -w /src "$(sed -n 's/^image //p' tools/b3sum-release.toolchain)" sh tools/b3sum-release-container.sh
      - name: Upload rebuilt release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: b3sum-${{ runner.arch }}
          path: dist/
          if-no-files-found: error

  clean:
    name: every published artifact is a clean build of the version commit
    needs: [verify-tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Check out the verified code commit (proven in verify-tag to be in
      # origin/main's history and to be the version commit's parent) so the
      # checker comes from the code commit, never a forged version commit.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify-tag.outputs.code }}
          fetch-depth: 0
      - name: Fetch main and verify tag still resolves to verified commit
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main "refs/tags/$TAG:refs/tags/$TAG"
          current=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if [[ "$current" != "$COMMIT" ]]; then
            echo "tag $TAG moved from $COMMIT to $current during verification" >&2
            exit 1
          fi
          test -f tools/release_artifacts.py || { echo "code commit has no tools/release_artifacts.py" >&2; exit 1; }
      # Each job's files in a folder of their own under rebuilt/, not merged
      # into one: merged, the later job's crate replaces the earlier job's
      # unread, and a builder whose crate differed would go unseen. The
      # check compares what was published with every builder's copy, and is
      # told which builders there are (the two jobs above, by their
      # artifacts' names): each must have left its folder, with its own
      # target binary and the b3sums crate.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: b3sum-*
          path: rebuilt
      - name: tools/release_artifacts.py TAG --commit COMMIT --published --rebuilt rebuilt --builders b3sum-X64=x86_64-unknown-linux-gnu,b3sum-ARM64=aarch64-unknown-linux-gnu
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          COMMIT: ${{ needs.verify-tag.outputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/release_artifacts.py "$TAG" --commit "$COMMIT" --published --rebuilt rebuilt --builders b3sum-X64=x86_64-unknown-linux-gnu,b3sum-ARM64=aarch64-unknown-linux-gnu
