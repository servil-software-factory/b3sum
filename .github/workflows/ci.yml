name: CI

on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  test:
    name: b3sum ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - name: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust toolchain
        run: |
          TOOLCHAIN=$(sed -n 's/^rustc //p' tools/b3sum-release.toolchain)
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$TOOLCHAIN"
      - name: Install nextest
        run: sh tools/ci-tools.sh nextest
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --bins -- -D warnings
      - name: Test
        run: cargo nextest run --locked --release
      - name: LTO CFLAGS build check
        run: cargo build --locked
        env:
          CFLAGS: -flto
