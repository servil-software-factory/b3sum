name: CI

on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  supply_chain:
    name: dependency policy (cargo-deny + cargo-vet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust toolchain
        run: |
          TOOLCHAIN=$(sed -n 's/^rustc //p' tools/b3sum-release.toolchain)
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
      - name: Install hash-verified cargo-deny and cargo-vet
        run: sh tools/ci-tools.sh cargo-deny cargo-vet
      - name: Check path allowlist, cargo-deny, cargo-vet, and planted-fault controls
        run: |
          python3 tools/test_dependency_policy.py
          python3 tools/dependency_policy.py
          python3 tools/dependency_policy.py controls

  test:
    name: b3sum ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - name: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust toolchain
        run: |
          TOOLCHAIN=$(sed -n 's/^rustc //p' tools/b3sum-release.toolchain)
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$TOOLCHAIN"
      - name: Install nextest
        run: sh tools/ci-tools.sh nextest
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --bins -- -D warnings
      - name: Test
        run: cargo nextest run --locked --release
      - name: LTO CFLAGS build check
        run: cargo build --locked
        env:
          CFLAGS: -flto
      - name: Safety controls (Linux)
        if: runner.os == 'Linux'
        run: python3 tools/b3sum_controls.py
      - name: Release artifact verification tests (Linux)
        if: runner.os == 'Linux'
        run: python3 tools/test_release_artifacts.py

  b3sum_release_build:
    name: b3sum release build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Build static Linux binary in pinned container
        run: docker run --rm -e B3SUM_RELEASE_ANY_COMMIT=1 -v "$PWD":/src -w /src "$(sed -n 's/^image //p' tools/b3sum-release.toolchain)" sh tools/b3sum-release-container.sh
      - name: Upload release binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: b3sum-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
